<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B7BF6"/>
      <stop offset="100%" stop-color="#3A48C8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background (iOS-style app icon shape) -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- ── Meditation figure ────────────────────────────────────────────────── -->

  <!-- Head -->
  <circle cx="256" cy="158" r="40" fill="white"/>

  <!-- Body + lotus legs silhouette
       Narrow at the shoulders, slight waist taper, then fans wide
       at the knees/feet to read as a classic lotus pose. -->
  <path d="M 218 212
           C 214 234 218 257 222 278
           C 215 303 182 333 148 378
           L 364 378
           C 330 333 297 303 290 278
           C 294 257 298 234 294 212
           C 275 204 237 204 218 212 Z"
        fill="white"/>

  <!-- Left arm (shoulder → resting hand on knee) -->
  <line x1="212" y1="252" x2="155" y2="356"
        stroke="white" stroke-width="22" stroke-linecap="round"/>

  <!-- Right arm -->
  <line x1="300" y1="252" x2="357" y2="356"
        stroke="white" stroke-width="22" stroke-linecap="round"/>

  <!-- Left hand (palm resting on knee in mudra) -->
  <circle cx="150" cy="363" r="18" fill="white"/>

  <!-- Right hand -->
  <circle cx="362" cy="363" r="18" fill="white"/>

  <!-- ── Audio / instruction waves ───────────────────────────────────────── -->
  <!-- These represent the voice-guided audio instruction that is central
       to the app — two concentric arcs on each side, like a speaker icon. -->

  <!-- Left inner arc -->
  <path d="M 112 244 Q 72 294 112 344"
        stroke="white" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.65"/>

  <!-- Left outer arc -->
  <path d="M 86 218 Q 34 294 86 370"
        stroke="white" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.35"/>

  <!-- Right inner arc -->
  <path d="M 400 244 Q 440 294 400 344"
        stroke="white" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.65"/>

  <!-- Right outer arc -->
  <path d="M 426 218 Q 478 294 426 370"
        stroke="white" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.35"/>
</svg>
