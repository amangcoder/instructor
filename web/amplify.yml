version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - export NEXT_TELEMETRY_DISABLED=1
            - echo "node-linker=hoisted" > ../.npmrc
            - corepack enable
            - corepack prepare pnpm@latest --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
          - ../node_modules/**/*
