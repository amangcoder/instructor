<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 60" width="180" height="60">
  <!-- Background -->
  <rect width="180" height="60" rx="8" fill="black"/>

  <!-- Google Play Logo -->
  <g transform="translate(10, 8)">
    <defs>
      <linearGradient id="playGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#34A853;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#1F7E3F;stop-opacity:1" />
      </linearGradient>
    </defs>
    <rect width="38" height="38" rx="6" fill="url(#playGradient1)"/>
    <!-- Google Play triangle icon -->
    <path d="M 10 10 L 28 26 L 10 42 Z" fill="white" opacity="0.95"/>
    <path d="M 28 26 L 16 15 L 12 11 Z" fill="rgba(255,255,255,0.7)"/>
    <path d="M 28 26 L 16 37 L 12 41 Z" fill="rgba(255,255,255,0.85)"/>
  </g>

  <!-- Text -->
  <text x="58" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" letter-spacing="0.5">Get it on</text>
  <text x="58" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="white">Google Play</text>
</svg>
