<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 60" width="180" height="60">
  <!-- Background -->
  <rect width="180" height="60" rx="8" fill="black"/>

  <!-- App Store Logo -->
  <g transform="translate(10, 8)">
    <defs>
      <linearGradient id="appStoreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#5AC8FA;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#007AFF;stop-opacity:1" />
      </linearGradient>
    </defs>
    <rect width="38" height="38" rx="6" fill="url(#appStoreGradient)"/>
    <!-- Stylized Apple/App icon -->
    <path d="M 12 10 Q 14 8 16 8 Q 18 8 19 10 L 19 28 Q 19 30 16 32 Q 14 33 12 33 Q 10 33 9 32 Q 6 30 6 28 L 6 10 Q 6 8 8 8 Q 10 8 12 10 Z" fill="white" opacity="0.9"/>
    <circle cx="14" cy="22" r="4" fill="white" opacity="0.8"/>
  </g>

  <!-- Text -->
  <text x="58" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" letter-spacing="0.5">Download on the</text>
  <text x="58" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="white">App Store</text>
</svg>
